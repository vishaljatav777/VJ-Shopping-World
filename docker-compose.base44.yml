services:
  mysql:
    image: mysql:8
    container_name: vj_base44_mysql
    restart: on-failure
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: vj_shopping_world
      MYSQL_USER: vj_user
      MYSQL_PASSWORD: vj_pass
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u vj_user -pvj_pass --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 40s

  backend:
    image: node:22
    container_name: vj_base44_backend
    restart: on-failure
    working_dir: /app/backend
    volumes:
      - ./:/app
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8000:5000"
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    environment:
      - JWT_SECRET=base44_dev_jwt_secret_vj_express_2026
      - PORT=5000
      - BASE44_PREVIEW_MODE=${BASE44_PREVIEW_MODE:-0}
    command:
      ["sh", "-ec", "npm install && npx prisma generate && npx prisma db push --accept-data-loss && npx tsx src/seed.ts && exec npx tsx watch src/index.ts"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  frontend:
    image: node:22
    container_name: vj_base44_frontend
    restart: on-failure
    working_dir: /app/frontend
    volumes:
      - ./:/app
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:5173"
    environment:
      - VITE_API_BASE_URL=https://8000-${BASE44_PUBLIC_HOST_SUFFIX}/api
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
      - BASE44_PREVIEW_MODE=${BASE44_PREVIEW_MODE:-0}
    command:
      ["sh", "-ec", "npm install && exec npx vite --host 0.0.0.0 --port 5173"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5173/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

volumes:
  mysql_data:
